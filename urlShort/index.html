<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축기</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <a href="../index.html" class="logo-link">
      <img src="../url2qr/img/logo.png" alt="Logo" class="logo">
    </a>
    <nav class="nav-menu">
      <a href="../url2qr/index.html" class="nav-btn">QR코드</a>
      <a href="index.html" class="nav-btn active">URL단축</a>
    </nav>
  </header>

  <main>
    <div class="shortener-card glass">
      <div class="card-header">
        <h1 class="card-title">URL 단축기</h1>
        <p class="card-subtitle">길고 복잡한 URL을 간결한 단축 링크로 변환하세요</p>
      </div>

      <!-- 입력 영역 -->
      <div class="input-section">
        <label for="url-input" class="input-label">단축할 URL 입력</label>
        <div class="input-group">
          <input 
            type="url" 
            id="url-input" 
            placeholder="https://example.com/very/long/url..." 
            autocomplete="off" 
            spellcheck="false"
          />
          <button id="shorten-btn" disabled>
            <span class="btn-text">단축하기</span>
            <span class="loader hidden"></span>
          </button>
        </div>
        <p id="error-message" class="error-msg hidden"></p>
      </div>

      <!-- 결과 출력 영역 -->
      <div id="result-section" class="result-section hidden">
        <label for="shortened-url" class="input-label">단축된 URL</label>
        <div class="result-group">
          <input 
            type="text" 
            id="shortened-url" 
            readonly 
            placeholder="단축된 URL이 여기에 표시됩니다"
          />
          <button id="copy-btn" class="copy-btn" title="클립보드에 복사">
            <svg class="copy-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
              <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
            </svg>
            <span>복사</span>
          </button>
          <a id="open-link-btn" href="#" target="_blank" rel="noopener noreferrer" class="open-btn" title="새 탭에서 열기">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
          </a>
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
